services:
  - type: web
    name: library-shelf
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    buildCommand: mvn -DskipTests package
    startCommand: java -jar target/library-shelf-1.0.0.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: "mysql"
      - key: MYSQL_HOST
        value: ""
        isSecret: true
      - key: MYSQL_PORT
        value: "4000"
        isSecret: false
      - key: MYSQL_DB
        value: ""
        isSecret: true
      - key: MYSQL_USER
        value: ""
        isSecret: true
      - key: MYSQL_PASSWORD
        value: ""
        isSecret: true
      - key: SERVER_PORT
        value: "8080"
        isSecret: false
    healthCheckPath: /actuator/health
services:
  - type: web
    name: library-shelf
    env: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: MYSQL_HOST
        value: <your-mysql-host>
      - key: MYSQL_PORT
        value: 3306
      - key: MYSQL_DB
        value: <your-db-name>
      - key: MYSQL_USER
        value: <your-db-user>
      - key: MYSQL_PASSWORD
        value: <your-db-password>
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    buildCommand: ""
    startCommand: ""
