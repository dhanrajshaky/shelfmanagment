# Use H2 in-memory database by default (for quick run)
spring.datasource.url=jdbc:h2:mem:librarydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Enable H2 console for inspecting the in-memory database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# To use MySQL (instead of the default H2 in-memory DB)
# 1) Create a database (example `library_db`) using MySQL Workbench or run
#    the provided SQL: `sql/sample-data.sql`.
# 2) Edit `src/main/resources/application-mysql.properties` and set your
#    `spring.datasource.username` and `spring.datasource.password`.
# 3) Start the app with the MySQL profile enabled:
#      mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#    or
#      mvn -Dspring.profiles.active=mysql spring-boot:run
#    or set the env var `SPRING_PROFILES_ACTIVE=mysql` and run the JAR.
#
# If you'd like, I can update `application.properties` directly with your
# MySQL credentials and import `sql/sample-data.sql` into your MySQL server.
# -----------------------------------------------------------------------------

# MySQL configuration example (to use MySQL, comment H2 above and uncomment/edit below)
# spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
