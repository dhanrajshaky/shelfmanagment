## MySQL profile for library-shelf
# This file uses environment variables with sane defaults so you don't
# have to commit credentials. Set the following env vars if needed:
#  - MYSQL_HOST (default: localhost)
#  - MYSQL_PORT (default: 3306)
#  - MYSQL_DB (default: library_db)
#  - MYSQL_USER (default: root)
#  - MYSQL_PASSWORD (default: change_me)
# Example (PowerShell):
#  $env:MYSQL_PASSWORD = 'yourpassword'; mvn -Dspring.profiles.active=mysql spring-boot:run


# JDBC config for MySQL/PlanetScale (all values from environment variables)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# URL, username, password are set by DataSourceConfig using env vars:
#   MYSQL_HOST, MYSQL_PORT, MYSQL_DB, MYSQL_USER, MYSQL_PASSWORD

# Example Render/PlanetScale env var mapping:
#   MYSQL_HOST=gateway01.ap-southeast-1.prod.aws.tidbcloud.com
#   MYSQL_PORT=4000
#   MYSQL_DB=shelfmanagment
#   MYSQL_USER=28roJeAi16PthQY.root
#   MYSQL_PASSWORD=8dhLnrSAafgChdhu

# NOTE: PlanetScale does NOT allow CREATE DATABASE. The DB must already exist.
#       DataSourceConfig will attempt to create the DB, but will not fail if it already exists.

# JPA / Hibernate (JPA will create/update schema according to entities)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server port (optional)
server.port=8080

# NOTES:
# - With `spring.jpa.hibernate.ddl-auto=update`, Spring Data JPA will create/alter
#   tables based on your entity mappings. You don't need to manually create schema.
# - If you prefer the app to NOT modify schema, change `ddl-auto` to `validate`.
