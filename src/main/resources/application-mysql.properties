## MySQL profile for library-shelf
# This file uses environment variables so credentials are not committed.
# Set the following env vars (examples below) in your local shell or in
# the Render.com service dashboard environment variables panel.
#   - MYSQL_HOST (e.g. gateway01.ap-southeast-1.prod.aws.tidbcloud.com)
#   - MYSQL_PORT (e.g. 4000)
#   - MYSQL_DB (e.g. shelfmanagment)
#   - MYSQL_USER (e.g. 28roJeAi16PthQY.root)
#   - MYSQL_PASSWORD (your secret password)
#   - SPRING_PROFILES_ACTIVE=mysql
# Example (PowerShell):
#  $env:MYSQL_HOST = 'gateway01.ap-southeast-1.prod.aws.tidbcloud.com'
#  $env:MYSQL_PORT = '4000'
#  $env:MYSQL_DB = 'shelfmanagment'
#  $env:MYSQL_USER = '28roJeAi16PthQY.root'
#  $env:MYSQL_PASSWORD = 'your_password'
#  $env:SPRING_PROFILES_ACTIVE = 'mysql'
#  mvn -Dspring.profiles.active=mysql spring-boot:run


# JDBC driver (URL is constructed at runtime by `DataSourceConfig` using the env vars)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Example Render environment variables to set (use the values you provided):
#   MYSQL_HOST=gateway01.ap-southeast-1.prod.aws.tidbcloud.com
#   MYSQL_PORT=4000
#   MYSQL_DB=shelfmanagment
#   MYSQL_USER=28roJeAi16PthQY.root
#   MYSQL_PASSWORD=ySnv54FOHO8BQYe4
#   SPRING_PROFILES_ACTIVE=mysql

# NOTE: PlanetScale/TiDB do NOT allow `CREATE DATABASE` on managed branches.
# The database named by `MYSQL_DB` must already exist (create it via PlanetScale
# console or using the provider tools). `DataSourceConfig` will skip CREATE DATABASE
# for cloud hosts and will set SSL params automatically.

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Management / Actuator
# Expose minimal actuator endpoints so platform health checks work
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Server port (optional)
server.port=8080

# NOTES:
# - `spring.jpa.hibernate.ddl-auto=update` will create/alter tables on first run.
#   For production you may prefer `validate` and manage schema migrations externally.
# - This profile constructs the JDBC URL from environment variables and will
#   attempt to connect to the configured MySQL-compatible host. The datasource
#   now fails fast on connection errors (no H2 fallback) so deployments will
#   surface DB misconfiguration immediately. Ensure all `MYSQL_` env vars are set
#   correctly in your render/service environment before deploying.
